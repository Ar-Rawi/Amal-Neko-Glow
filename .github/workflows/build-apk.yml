name: Build Amal Neko Android APK & Widgets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies & Capacitor
        run: |
          npm install --legacy-peer-deps

      - name: Prepare Web Assets Directory (www)
        run: |
          node scripts/prepare-www.js

      - name: Generate Fresh Android Project with Capacitor
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Inject Native Widget Providers, Layouts & Manifest
        run: |
          mkdir -p android/app/src/main/java/com/amalnekoglow/app
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/drawable

          cp native-widgets/java/*.java android/app/src/main/java/com/amalnekoglow/app/
          cp native-widgets/res/layout/*.xml android/app/src/main/res/layout/
          cp native-widgets/res/xml/*.xml android/app/src/main/res/xml/
          cp native-widgets/res/drawable/*.xml android/app/src/main/res/drawable/
          node scripts/inject-widgets.js

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Amal-Neko-v3.0.apk

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amal-Neko-v3.0-APK
          path: Amal-Neko-v3.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v3.0.0
          name: "Amal Neko v3.0 — Android APK with Home Screen Widgets"
          body: |
            ## 🐱 Amal Neko v3.0 (Android APK) 🐾
            
            ### ✨ Features Included:
            - **Real Native Android Home Screen Widgets:**
              - 3x2 Wide Study Widget
              - 3x3 Square Dashboard Widget
              - 2x3 Tall Goals Widget
            - Rebranded by **Rawi 🐾**
            - Multi-tone colored SVG icons & vibrant obsidian aesthetic
            - Progress tracking & sound companion
            
            ### 📲 How to Install & Add Widgets:
            1. Download `Amal-Neko-v3.0.apk` below directly onto your Android phone.
            2. Tap the downloaded file to install (*Allow install from unknown sources if prompted*).
            3. Long-press on your phone's Home Screen $\rightarrow$ tap **Widgets** $\rightarrow$ select **Amal Neko 🐾** $\rightarrow$ drag onto your screen!
          files: Amal-Neko-v3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
